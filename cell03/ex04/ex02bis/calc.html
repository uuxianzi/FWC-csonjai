<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="calc.css">
</head>
<body>

    <div class="calculator-container">

        <input type="text" id="left-input" placeholder="Left member">


        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
        </select>


        <input type="text" id="right-input" placeholder="Right member">


        <input type="submit" id="btn" value="Try me!">
    </div>

    <script src="calc.js"></script>
</body>
</html>
