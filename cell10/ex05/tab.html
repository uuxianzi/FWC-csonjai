<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0px;
        }
        .boxes {
            display: flex;
            border: 1px;
            height: 100px;
        }
        .b1 {
            border: 1px solid black;
            background-color: black;
            color: white;
            width: 50%;
            padding: 10px;

            display: flex;
            align-items: center;
            justify-content: center;
        }
        .b2 {
            border: 1px solid black;
            background-color: brown;
            width: 50%;
            padding: 10px;

            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="boxes">
        <div class="b1">I'm a sleepyhead</div>
        <div class="b2">Yeah i can tell</div>
    </div>
</body>
</html>
